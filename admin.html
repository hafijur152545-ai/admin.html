<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#f2f3f7;margin:0}
.header{background:#222;color:#fff;padding:15px;text-align:center;font-size:20px}
.card{background:#fff;margin:10px;padding:12px;border-radius:10px}
.btn{padding:10px;border:none;border-radius:6px;color:#fff;cursor:pointer;width:100%;margin-top:6px}
.approve{background:#28a745}
.reject{background:#d32f2f}
.list{font-size:14px;margin-top:8px}
</style>
</head>

<body>
<div class="header">👑 Admin Panel</div>

<div class="card">
  <h3>Withdraw Requests</h3>
  <div id="withdrawList">Loading...</div>
</div>

<!-- 🔥 Firebase + Admin Logic -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* 🔧 Firebase Config (তোমারটাই) */
const firebaseConfig = {
  apiKey: "AIzaSyD5SUP7tfK5I1vEEoDm3qwkHM6MUQ3jE",
  authDomain: "maniriye1bot0.firebaseapp.com",
  databaseURL: "https://maniriye1bot0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "maniriye1bot0",
  storageBucket: "maniriye1bot0.appspot.com",
  messagingSenderId: "386824179846",
  appId: "1:386824179846:web:e6eadd434a3151e48e0107"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* 🔐 ADMIN UID */
const ADMIN_UID = "6560485203";

/* ✅ Telegram Check */
const tg = Telegram.WebApp;
const user = tg.initDataUnsafe?.user;

if (!user || user.id.toString() !== ADMIN_UID) {
  document.body.innerHTML =
    "<h2 style='text-align:center;margin-top:50px'>⛔ Access Denied</h2>";
  throw new Error("Not Admin");
}

/* 📥 Withdraw Requests */
const list = document.getElementById("withdrawList");
const withdrawRef = ref(db, "withdraws");

onValue(withdrawRef, (snap) => {
  list.innerHTML = "";
  if (!snap.exists()) {
    list.innerHTML = "<p>No requests</p>";
    return;
  }

  snap.forEach(child => {
    const d = child.val();
    if (d.status !== "pending") return;

    list.innerHTML += `
      <div class="list">
        👤 UID: ${d.uid}<br>
        💸 Amount: ${d.amount}৳<br>
        📱 Number: ${d.number}<br>
        <button class="btn approve" onclick="approve('${child.key}')">Approve</button>
        <button class="btn reject" onclick="reject('${child.key}')">Reject</button>
        <hr>
      </div>
    `;
  });
});

window.approve = (id) => {
  update(ref(db, "withdraws/"+id), { status: "approved" });
  alert("Approved");
};

window.reject = (id) => {
  update(ref(db, "withdraws/"+id), { status: "rejected" });
  alert("Rejected");
};
</script>

</body>
</html>
